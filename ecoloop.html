<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EcoLoop | Gamified Citizen Science</title>
<style>
:root{
  --navy:#0B1F3A; --navy2:#132C52; --navy3:#1E3F6F;
  --yellow:#FFC928; --yellow2:#FFE27A; --ysoft:#FFF6D6;
  --white:#FFFFFF; --bg:#F4F6FA; --line:#E3E9F3;
  --muted:#5D6F8C; --danger:#D9423A; --ok:#1E9E6A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.hidden{display:none !important}

/* ===== APP SHELL ===== */
#app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--white);position:relative;padding-bottom:96px;box-shadow:0 0 40px rgba(11,31,58,.08)}
body.is-auth #app{padding-bottom:0}
body.is-auth .topbar,body.is-auth .bottomnav{display:none}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--navy);color:var(--white)}
.brand{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:9px}
.brand-mark{width:32px;height:32px;flex-shrink:0}
.brand-mark .badge{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.2);stroke-width:2}
.brand-mark .orbit{fill:none;stroke:var(--yellow);stroke-width:6;stroke-linecap:round}
.brand-mark .orbit.second{stroke:var(--yellow2)}
.brand-mark .arrow{fill:var(--yellow)}
.brand-mark .arrow.second{fill:var(--yellow2)}
.brand-mark .coin{fill:var(--yellow);stroke:var(--yellow2);stroke-width:2}
.brand-mark .coin-ring{fill:none;stroke:var(--navy);stroke-opacity:.35;stroke-width:1.5}
.brand-mark .leaf{fill:var(--navy)}
.brand-mark .vein{fill:none;stroke:var(--yellow2);stroke-width:2.5;stroke-linecap:round}
.pill{background:var(--yellow);color:var(--navy);padding:7px 14px;border-radius:999px;font-weight:700;font-size:.85rem}
main{padding:16px 16px 24px}
.view{animation:fadeUp .45s ease both}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,var(--navy3),var(--navy) 65%);color:var(--white);transition:opacity .6s ease,visibility .6s;cursor:pointer}
#splash.hide{opacity:0;visibility:hidden}
.splash-inner{text-align:center;padding:24px;animation:rise .9s ease both}
.splash-logo{width:144px;height:144px;margin:0 auto 14px;display:block;overflow:visible;filter:drop-shadow(0 12px 22px rgba(0,0,0,.2))}
.eco-mark .badge{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.13);stroke-width:1.5}
.eco-mark .orbit{fill:none;stroke:var(--yellow);stroke-width:5;stroke-linecap:round;stroke-dasharray:118;stroke-dashoffset:118;animation:draw 1.15s cubic-bezier(.65,0,.35,1) forwards .2s}
.eco-mark .orbit.second{stroke:var(--yellow2);animation-delay:.65s}
.eco-mark .arrow{fill:var(--yellow);opacity:0;animation:logoPop .35s ease forwards 1.1s}
.eco-mark .arrow.second{fill:var(--yellow2);animation-delay:1.5s}
.eco-mark .coin{fill:var(--yellow);stroke:var(--yellow2);stroke-width:2;opacity:0;transform-origin:60px 60px;animation:leafIn .65s cubic-bezier(.2,.8,.2,1) forwards 1.2s}
.eco-mark .coin-ring{fill:none;stroke:var(--navy);stroke-opacity:.3;stroke-width:2}
.eco-mark .leaf{fill:var(--navy)}
.eco-mark .vein{fill:none;stroke:var(--yellow2);stroke-width:3;stroke-linecap:round;stroke-dasharray:32;stroke-dashoffset:32;animation:draw .6s ease forwards 1.55s}
.brand-mark.eco-mark .orbit,.brand-mark.eco-mark .vein{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
.brand-mark.eco-mark .arrow,.brand-mark.eco-mark .coin{opacity:1;animation:none}
.brand-mark.eco-mark .coin{transform:none}
.splash-inner h1{font-size:2.2rem;font-weight:800}
.splash-tag{color:var(--yellow2);margin:6px 0 22px;font-size:.95rem}
.splash-bar{width:180px;height:6px;margin:0 auto 10px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}
.splash-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--yellow2));border-radius:999px;animation:load 2.8s ease forwards}
.splash-inner small{opacity:.6;font-size:.75rem}

/* ===== AUTH ===== */
.auth-hero{background:linear-gradient(160deg,var(--navy),var(--navy2));color:var(--white);border-radius:0 0 28px 28px;padding:44px 24px 36px;margin:-16px -16px 18px}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-weight:800;font-size:1.05rem}
.auth-mark{width:42px;height:42px;flex-shrink:0}
.auth-mark .orbit,.auth-mark .vein{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
.auth-mark .arrow,.auth-mark .coin{opacity:1;animation:none}
.auth-mark .coin{transform:none}
.auth-mark .coin-ring{fill:none;stroke:var(--navy);stroke-opacity:.3;stroke-width:2}
.auth-mark .leaf{fill:var(--navy)}
.auth-mark .vein{stroke:var(--yellow2)}
.auth-brand small{display:block;margin-top:2px;color:rgba(255,255,255,.72);font-size:.68rem;font-weight:500}
.eyebrow{display:inline-block;background:var(--yellow);color:var(--navy);font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:12px}
.auth-hero h2{font-size:1.6rem;line-height:1.25;font-weight:800}
.auth-hero p{margin-top:10px;opacity:.85;font-size:.9rem;line-height:1.5}
.auth-form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.auth-form label{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.auth-form input,.auth-form select{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--white);color:var(--navy);outline:none}
.auth-form input:focus,.auth-form select:focus{border-color:var(--yellow)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px}
.tab{padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.tab.active{background:var(--navy);color:var(--white)}

/* ===== CARDS & BUTTONS ===== */
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px -12px rgba(11,31,58,.25)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:14px;font-weight:700;font-size:.9rem;margin-top:8px;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--yellow);color:var(--navy);box-shadow:0 6px 16px -6px rgba(255,201,40,.8)}
.btn-primary:hover{background:var(--yellow2)}
.btn-ghost{background:var(--white);color:var(--navy);border:1.5px solid var(--navy)}
.btn-ghost:hover{background:var(--navy);color:var(--white)}
.btn-danger{background:#FDECEA;color:var(--danger);border:1.5px solid #F5C2BE}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row-btns .btn{margin-top:0}
.stack{display:flex;flex-direction:column;gap:10px}
.hint{color:var(--muted);font-size:.8rem;line-height:1.5;display:block}
.label{font-size:.8rem;font-weight:700;margin:16px 0 8px}
.tag{display:inline-block;font-size:.7rem;font-weight:700;background:var(--ysoft);color:var(--navy);padding:3px 9px;border-radius:999px;margin-bottom:8px}
.page-head{margin-bottom:14px}
.page-head h2{font-size:1.35rem;font-weight:800}
.page-head .hint{margin-top:4px}
.footer-note{text-align:center;font-size:.68rem;color:var(--muted);margin-top:10px}

/* ===== HOME ===== */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy3));color:var(--white);border-radius:22px;padding:20px;margin-bottom:14px;overflow:hidden}
.hero .hint{color:rgba(255,255,255,.7)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.hero h2{font-size:1.2rem;font-weight:800;margin-top:2px}
.lvl{background:var(--yellow);color:var(--navy);font-weight:800;font-size:.8rem;padding:6px 12px;border-radius:999px}
.balance{margin-top:16px;display:flex;align-items:baseline;gap:8px;font-size:.8rem;color:rgba(255,255,255,.8)}
.balance strong{font-size:2rem;color:var(--yellow);font-weight:800}
.xp{margin-top:14px;height:9px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
.xp-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--yellow),var(--yellow2));transition:width .8s ease}
.hero .hint{margin-top:6px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--ysoft);font-size:.7rem;font-weight:600;transition:transform .2s,background .2s}
.quick button:hover{background:var(--yellow);transform:translateY(-2px)}
.quick i{font-style:normal;font-size:1.4rem}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 10px 30px -12px rgba(11,31,58,.2);transition:transform .2s}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;font-size:1.2rem;font-weight:800}
.stat span{font-size:.68rem;color:var(--muted);line-height:1.3;display:block;margin-top:2px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.moods button{padding:10px 4px;border-radius:14px;font-size:.75rem;font-weight:600;background:var(--bg);border:1.5px solid transparent;transition:all .2s}
.moods button:hover{border-color:var(--yellow);background:var(--ysoft)}
.mood-msg{margin-top:12px;font-size:.82rem;line-height:1.5;background:var(--ysoft);border-left:4px solid var(--yellow);padding:10px 12px;border-radius:10px}
.mood-msg:empty{display:none}
.check{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin-top:8px;border-radius:14px;border:1.5px solid var(--line);text-align:left;font-size:.85rem;font-weight:500;transition:all .2s}
.check span{width:22px;height:22px;border-radius:7px;flex-shrink:0;border:1.5px solid var(--navy3);display:grid;place-items:center;font-size:.75rem;font-weight:800}
.check.done{background:var(--ysoft);border-color:var(--yellow)}
.check.done span{background:var(--yellow);border-color:var(--yellow)}
.mission-card{background:var(--navy);color:var(--white);border-radius:16px;padding:14px}
.mission-card b{color:var(--yellow);font-size:.95rem}
.mission-card p{font-size:.8rem;opacity:.85;margin-top:4px}
.mission-done{background:var(--ysoft);padding:10px 12px;border-radius:12px;margin:10px 0;font-weight:600;font-size:.85rem}
.mission-item{padding:14px;border-radius:14px;background:var(--bg);margin-bottom:10px}
.mission-item b{font-size:.9rem}
.mission-item p{margin:4px 0 6px}
.mission-item small{display:block;color:var(--navy3);font-weight:700}

/* ===== PETA & RANK ===== */
.kel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kel{text-align:left;padding:14px;border-radius:16px;background:var(--white);border:1.5px solid var(--line);box-shadow:0 10px 30px -12px rgba(11,31,58,.2);display:flex;flex-direction:column;gap:8px;transition:transform .2s,border-color .2s}
.kel:hover{transform:translateY(-2px);border-color:var(--yellow)}
.kel b{font-size:.82rem;line-height:1.3}
.kel small{font-size:.66rem;color:var(--muted);line-height:1.4}
.meter{height:7px;background:var(--line);border-radius:999px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--navy3),var(--navy))}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;margin-top:8px;background:var(--bg);font-size:.85rem}
.rank-row .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--navy);color:var(--white);flex-shrink:0}
.rank-row.gold .no{background:var(--yellow);color:var(--navy)}
.rank-row .name{flex:1;font-weight:600}
.rank-row .xpv{font-weight:800;color:var(--navy3);font-size:.8rem}
.rank-row.me{border:1.5px solid var(--yellow);background:var(--ysoft)}

/* ===== SCAN ===== */
.viewfinder{position:relative;height:240px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(255,201,40,.12),transparent 60%),linear-gradient(160deg,var(--navy2),var(--navy));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--white)}
.vf-corners{position:absolute;inset:20px;pointer-events:none;
  background:
    linear-gradient(var(--yellow),var(--yellow)) top left/26px 3px no-repeat,
    linear-gradient(var(--yellow),var(--yellow)) top left/3px 26px no-repeat,
    linear-gradient(var(--yellow),var(--yellow)) top right/26px 3px no-repeat,
    linear-gradient(var(--yellow),var(--yellow)) top right/3px 26px no-repeat,
    linear-gradient(var(--yellow),var(--yellow)) bottom left/26px 3px no-repeat,
    linear-gradient(var(--yellow),var(--yellow)) bottom left/3px 26px no-repeat,
    linear-gradient(var(--yellow),var(--yellow)) bottom right/26px 3px no-repeat,
    linear-gradient(var(--yellow),var(--yellow)) bottom right/3px 26px no-repeat}
.scan-line{position:absolute;left:0;right:0;top:0;height:3px;background:var(--yellow);box-shadow:0 0 16px var(--yellow);opacity:0}
.viewfinder.scanning .scan-line{opacity:1;animation:scan 1.6s ease-in-out infinite alternate}
.vf-icon{font-size:3.2rem;position:relative;z-index:1;animation:float 3s ease-in-out infinite}
.vf-status{position:relative;z-index:1;font-size:.82rem;font-weight:600;color:var(--yellow2);text-align:center;min-height:1.2em;padding:0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--bg);border:1.5px solid var(--line)}
.chip.on{background:var(--navy);color:var(--white);border-color:var(--navy)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px}
.seg button{padding:10px;border-radius:10px;font-weight:600;font-size:.82rem;color:var(--muted)}
.seg button.on{background:var(--yellow);color:var(--navy)}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:var(--line);outline:none;margin:8px 0 14px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--yellow);border:4px solid var(--navy);cursor:pointer}
.slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--yellow);border:3px solid var(--navy);cursor:pointer}
.result{margin-top:16px;padding:18px;border-radius:18px}
.result.ok{background:var(--white);border:1.5px solid var(--yellow);box-shadow:0 10px 30px -12px rgba(11,31,58,.25)}
.result.bad{background:#FFF4F2;border:1.5px solid #F3C6C1}
.result h3{font-size:1rem;font-weight:800;margin-bottom:10px}
.result p{font-size:.85rem;line-height:1.55}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.res-grid div{background:var(--bg);border-radius:12px;padding:10px}
.res-grid small{display:block;font-size:.68rem;color:var(--muted)}
.res-grid b{font-size:1.05rem;font-weight:800}
.formula{font-size:.75rem;color:var(--muted);background:var(--bg);padding:10px 12px;border-radius:12px}

/* ===== MARKET ===== */
.balance-mini{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:16px;margin-bottom:12px;background:linear-gradient(135deg,var(--navy),var(--navy3));color:var(--white);font-size:.85rem}
.balance-mini b{color:var(--yellow);font-size:1.1rem}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.item{text-align:left;padding:14px;border-radius:16px;background:var(--white);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:4px;transition:transform .2s,border-color .2s}
.item:hover{transform:translateY(-3px);border-color:var(--yellow)}
.item .ic{font-size:1.7rem}
.item b{font-size:.8rem;line-height:1.3;margin-top:4px}
.item small{font-size:.66rem;color:var(--muted);line-height:1.4}
.item em{margin-top:auto;padding-top:8px;font-style:normal;font-weight:800;color:var(--navy3);font-size:.8rem}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.82rem}
.hist:last-child{border-bottom:none}
.hist small{display:block;color:var(--muted);font-size:.68rem}
.amt{font-weight:800}
.amt.in{color:var(--ok)}
.amt.out{color:var(--danger)}

/* ===== PROFIL ===== */
.profile{text-align:center}
.avatar{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:1.8rem;font-weight:800;box-shadow:0 0 0 6px var(--ysoft)}
.profile h2{font-size:1.2rem;font-weight:800}
.lvl-line{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;background:var(--navy);color:var(--yellow);font-size:.75rem;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--bg);transition:transform .2s}
.badge:hover{transform:translateY(-2px)}
.badge span{font-size:1.6rem;filter:grayscale(1);opacity:.5}
.badge small{font-size:.64rem;text-align:center;font-weight:600;color:var(--muted);line-height:1.3}
.badge.on{background:var(--ysoft);border:1.5px solid var(--yellow)}
.badge.on span{filter:none;opacity:1}
.badge.on small{color:var(--navy)}

/* ===== EDUKASI ===== */
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin-bottom:12px;border-radius:16px;background:var(--white);border:1.5px solid var(--line);box-shadow:0 10px 30px -12px rgba(11,31,58,.2);transition:transform .2s,border-color .2s}
.lesson:hover{transform:translateY(-2px);border-color:var(--yellow)}
.lesson .num{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-weight:800;background:var(--navy);color:var(--yellow)}
.lesson.done .num{background:var(--yellow);color:var(--navy)}
.lesson b{font-size:.9rem;display:block}
.lesson small{color:var(--muted);font-size:.74rem;line-height:1.4;display:block;margin-top:2px}
.done-tag{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--ok);white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{text-align:left;padding:12px 14px;border-radius:12px;background:var(--bg);border:1.5px solid transparent;font-size:.82rem;font-weight:500;transition:all .2s}
.opt:hover{border-color:var(--yellow);background:var(--ysoft)}
.q{font-size:.88rem;margin-top:12px}

/* ===== TENTANG ===== */
.problem-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.problem-grid div{background:var(--navy);color:var(--white);border-radius:16px;padding:14px}
.problem-grid b{display:block;font-size:1.25rem;color:var(--yellow);font-weight:800}
.problem-grid span{font-size:.7rem;opacity:.85;line-height:1.4;display:block;margin-top:2px}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flow div{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:.75rem;font-weight:600;display:flex;gap:8px;align-items:center}
.flow em{font-style:normal;width:22px;height:22px;border-radius:50%;flex-shrink:0;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:.7rem;font-weight:800}
.penta{display:flex;flex-direction:column;gap:8px}
.penta button{text-align:left;padding:12px 14px;border-radius:14px;background:var(--bg);border:1.5px solid transparent;transition:all .2s}
.penta button:hover{border-color:var(--yellow)}
.penta button.open{background:var(--navy);color:var(--white)}
.penta b{font-size:.86rem;display:block}
.penta small{font-size:.72rem;opacity:.75}
.penta p{font-size:.78rem;line-height:1.5;margin-top:8px}
.road-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.road-tabs button{padding:10px 4px;border-radius:12px;font-size:.72rem;font-weight:700;background:var(--bg);color:var(--muted);transition:all .2s}
.road-tabs button.on{background:var(--yellow);color:var(--navy)}
.road-body ul{padding-left:18px;margin-top:8px}
.road-body li{font-size:.82rem;line-height:1.6;margin-bottom:4px}
.tbl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tbl-grid button{padding:14px 8px;border-radius:16px;text-align:center;background:var(--white);border:1.5px solid var(--line);transition:all .2s}
.tbl-grid button:hover{border-color:var(--yellow);transform:translateY(-2px)}
.tbl-grid i{font-style:normal;font-size:1.5rem;display:block}
.tbl-grid b{font-size:.8rem;display:block;margin-top:4px}
.team{font-size:.82rem;line-height:1.8}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.kv b{color:var(--navy)}

/* ===== BOTTOM NAV ===== */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);z-index:60;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;align-items:end;background:var(--navy);color:var(--white);padding:10px 6px 12px;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px -12px rgba(11,31,58,.5)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.6);font-size:.62rem;font-weight:600;transition:color .2s}
.nav-btn i{font-style:normal;font-size:1.15rem}
.nav-btn.on{color:var(--yellow)}
.nav-scan{width:58px;height:58px;margin:0 auto 6px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:1.4rem;box-shadow:0 0 0 5px var(--navy),0 8px 18px -4px rgba(255,201,40,.7)}

/* ===== MODAL & TOAST ===== */
.modal-overlay{position:fixed;inset:0;z-index:4000;display:none;align-items:center;justify-content:center;background:rgba(11,31,58,.7);padding:20px}
.modal-overlay.active{display:flex}
.modal-box{background:var(--white);border-radius:24px;padding:24px;width:100%;max-width:380px;max-height:85vh;overflow-y:auto;box-shadow:0 25px 60px -10px rgba(0,0,0,.35);animation:rise .3s ease both}
.modal-box h3{font-size:1.1rem;font-weight:800;margin-bottom:8px}
.modal-box p{font-size:.85rem;line-height:1.55;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:5000;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(400px,calc(100% - 32px))}
#toast .t{background:var(--navy);color:var(--white);padding:12px 16px;border-radius:14px;font-size:.8rem;font-weight:600;border-left:4px solid var(--yellow);text-align:center;box-shadow:0 10px 25px -8px rgba(11,31,58,.5);animation:rise .3s ease both;transition:opacity .4s}
#toast .t.out{opacity:0}

/* ===== ANIMASI ===== */
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes logoPop{to{opacity:1;transform:scale(1)}}
@keyframes leafIn{from{opacity:0;transform:scale(.72) rotate(-12deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes load{from{width:0}to{width:100%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes scan{from{top:0}to{top:calc(100% - 3px)}}
@media (max-width:360px){.quick{grid-template-columns:repeat(2,1fr)}.items,.kel-grid{grid-template-columns:1fr}}
</style>

<script>
(() => {
  'use strict';

  /* ---------- DATA ---------- */
  const LEVEL_XP = 1000;
  const LEVEL_TITLES = ['Penjaga Sungai','Pejuang Pilah','Penggerak Energi','Digital Heroes'];

  const KELURAHAN = [

  const CATS = {

    tekstil: { label:'Tekstil residu', icon:'👕', moist:[18,28], rdf:true },

  const MISSIONS = [

    { id:'m2', kel:'sukamaju', title:'Setor residu tekstil', target:'tekstil', minKg:1, xp:150,
      desc:'Kumpulkan minimal 1 kg tekstil residu yang sudah kering.' },
    { id:'m3', kel:'pasirputih', title:'Plastik residu dari warung', target:'plastik', minKg:1, xp:120,

    { id:'m4', kel:'cempaka', title:'Aksi mandiri: kertas kantor', target:'kertas', minKg:0.5, xp:90,

  const ITEMS = [
    { id:'token',    cat:'energi', name:'Token Listrik PLN 20K',   cost:2000, icon:'⚡', desc:'Potongan token listrik melalui mitra PLN' },
    { id:'emoney',   cat:'emoney', name:'E-Money 10K',             cost:1000, icon:'💳', desc:'Saldo e-money dari mitra pembayaran' },
    { id:'sabun',    cat:'produk', name:'Sabun Organik UMKM',      cost:500,  icon:'🧼', desc:'Produk UMKM lokal yang sudah bermitra' },
    { id:'tote',     cat:'produk', name:'Tas Tote Eco',            cost:800,  icon:'👜', desc:'Dibuat dari tekstil daur ulang UMKM' },
    { id:'mangrove', cat:'donasi', name:'Donasi 1 Bibit Mangrove', cost:300,  icon:'🌿', desc:'Disalurkan ke program penanaman mangrove' }
  ];
  const FILTERS = [['semua','Semua'],['energi','Energi'],['emoney','E-Money'],['produk','Produk UMKM'],['donasi','Donasi']];

  const LESSONS = [
    { id:'e1', title:'Kadar Air dan Nilai Kalor',
      body:'Sampah tropis cenderung basah dengan kadar air 60 hingga 70 persen. Air menyerap energi saat pembakaran sehingga nilai kalor turun dan biaya pengeringan naik.',
      q:'Sampah dengan kadar air 65% cenderung...',
      opts:['Lebih mudah dijadikan RDF','Nilai kalornya menurun dan kurang ekonomis','Tidak berpengaruh pada energi'],
      ans:1, explain:'Tepat. Karena itu pemilahan sampah kering di rumah sangat menentukan kualitas RDF.' },
    { id:'e2', title:'Apa Itu RDF?',
      body:'Refuse Derived Fuel adalah bahan bakar hasil olahan sampah residu yang sudah dikeringkan dan dipilah sesuai standar industri.',
      q:'RDF dibuat dari...',
      opts:['Sampah residu kering yang terpilah','Sampah basah dari dapur','Botol PET yang sudah didaur ulang'],
      ans:0, explain:'Tepat. RDF menyasar residu kering seperti kertas, tekstil, dan plastik bernilai rendah.' },
    { id:'e3', title:'Dari Cemas Menjadi Aksi',
      body:'Kecemasan iklim dapat berubah menjadi sikap apatis atau eco-paralysis bila tidak diarahkan. Aksi kecil yang hasilnya bisa dilihat membantu memutus lingkaran itu.',
      q:'Cara terbaik mengubah kecemasan iklim menjadi aksi adalah...',
      opts:['Menghindari berita lingkungan','Melakukan aksi kecil yang hasilnya bisa dilihat','Menunggu pemerintah bergerak sendiri'],
      ans:1, explain:'Tepat. Aksi terukur memberi rasa kendali yang melawan apatis.' }
  ];

  const BADGES = [
    { id:'sungai',   icon:'🌊', name:'Penjaga Sungai',  req:'Mulai perjalananmu di level 1',  check:s => levelOf(s.totalXP) >= 1 },
    { id:'adaptasi', icon:'♻️', name:'Adaptasi Pilah',  req:'Lakukan 1 scan yang valid',      check:s => s.validScans >= 1 },
    { id:'pedali',   icon:'🚲', name:'Pedali Sesama',   req:'Selesaikan 1 misi terpandu',     check:s => s.missionsDone >= 1 },
    { id:'literat',  icon:'📘', name:'Literat Energi',  req:'Selesaikan 3 modul edukasi',     check:s => s.lessonsDone.length >= 3 },
    { id:'heroism',  icon:'🏅', name:'Digital Heroism', req:'Tukarkan 1 Green Coin',          check:s => s.redeems >= 1 },
    { id:'duta',     icon:'📣', name:'Duta Lingkungan', req:'Undang 3 teman',                 check:s => s.referrals >= 3 }
  ];

  const DAILY = [
    { id:'d1', t:'Pilah sampah kering di rumah hari ini' },
    { id:'d2', t:'Jelaskan satu fakta RDF ke keluarga' },
    { id:'d3', t:'Cek kadar air sampah sebelum dibuang' }
  ];

  const OTHERS = [
    { name:'Siti Aminah', xp:5200 },
    { name:'Budi Santoso', xp:4800 },
    { name:'Bu RT 05', xp:4100 }
  ];

  const PENTA = [
    { t:'Pemerintah', r:'Regulator dan pendukung', d:'Menyusun standar RDF, memberi insentif fiskal, dan mendukung tarif listrik berbasis sampah sesuai Perpres 109 Tahun 2025.' },
    { t:'Akademisi', r:'Inovator dan konseptor', d:'Mengembangkan dan menguji algoritma AI (YOLOv8), meriset nilai kalor sampah, dan memantau dampak lingkungan.' },
    { t:'Bisnis', r:'Investor dan off-taker', d:'Menyediakan fasilitas pengolahan (PSEL), membeli RDF dari masyarakat, dan menyalurkan dukungan CSR.' },
    { t:'Komunitas', r:'Akselerator dan eksekutor', d:'Mengedukasi warga, menjadi titik kumpul (drop point), dan mendampingi warga yang belum terbiasa digital.' },
    { t:'Media', r:'Katalisator dan amplifikator', d:'Membangun narasi sampah jadi energi, mempromosikan Digital Heroism, dan menjaga transparansi dampak.' }
  ];

  const ROADMAP = [
    { y:'Tahun 1', t:'Inisiasi dan pilot', items:[
      'Pengembangan aplikasi beta dan pelatihan model AI',
      'Uji coba di 5 kelurahan bersama bank sampah induk',
      'Target akurasi deteksi awal minimal 85%'] },
    { y:'Tahun 2', t:'Ekspansi dan integrasi', items:[
      'Peluncuran di tingkat kota dan provinsi',
      'Integrasi token listrik PLN dan produk UMKM',
      'Optimalisasi algoritma AI hingga akurasi 95%'] },
    { y:'Tahun 3', t:'Nasional dan kemandirian', items:[
      'Replikasi sistem ke kota-kota besar lain',
      'Model bisnis B2B dengan industri semen dan PLN',
      'Target pengurangan sampah nasional 5% melalui platform'] }
  ];

  /* ---------- STATE ---------- */
  const state = {
    user:null, view:'auth',
    balance:1250, totalXP:750, weeklyXP:750,
    kg:12.0, scans:0, validScans:0, missionsDone:0, redeems:0, referrals:0, coinsIssued:0,
    lessonsDone:[], unlocked:new Set(), activeMission:null,
    history:[], daily:{}, moodMsg:'',
    selectedCat:'kertas', source:'langsung', weight:1.0,
    scanning:false, scanResult:null,
    filter:'semua', openPenta:-1, roadYear:0
  };

  /* ---------- HELPERS ---------- */
  const $  = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const fmt = n => Number(n).toLocaleString('id-ID');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const levelOf = xp => Math.floor(xp / LEVEL_XP) + 1;
  const levelTitle = l => LEVEL_TITLES[Math.min(l-1, LEVEL_TITLES.length-1)];
  const progressPct = () => (state.totalXP % LEVEL_XP) / LEVEL_XP * 100;
  const co2 = () => state.kg * CO2_FACTOR;
  const kelById = id => KELURAHAN.find(k => k.id === id) || KELURAHAN[0];
  const now = () => new Date().toLocaleString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});

  function toast(msg){
    const t = document.createElement('div');
    t.className = 't';
    t.textContent = msg;
    $('#toast').appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 2600);
  }
  function openModal(html){ $('#modal-box').innerHTML = html; $('#modal').classList.add('active'); }
  function closeModal(){ $('#modal').classList.remove('active'); }

  function pushHistory(label, amt){
    state.history.unshift({label, amt, date:now()});
    if (state.history.length > 30) state.history.pop();
  }
  function addCoins(n, label){
    state.balance += n;
    if (n > 0) state.coinsIssued += n;
    pushHistory(label, n);
  }
  function addXP(n){
    const before = levelOf(state.totalXP);
    state.totalXP += n;
    state.weeklyXP += n;
    const after = levelOf(state.totalXP);
    if (after > before) toast(`🎉 Naik ke Level ${after}: ${levelTitle(after)}`);
    checkBadges();
  }
  function checkBadges(){
    BADGES.forEach(b => {
      if (!state.unlocked.has(b.id) && b.check(state)) {
        state.unlocked.add(b.id);
        toast(`🏅 Lencana baru: ${b.name}`);
      }
    });
  }

  /* ---------- SPLASH ---------- */
  function finishSplash(){
    const s = $('#splash');
    if (s && !s.classList.contains('hide')) s.classList.add('hide');
  }
  setTimeout(finishSplash, 3200);
  $('#splash').addEventListener('click', finishSplash);

  /* ---------- NAVIGATION ---------- */
  const renderers = {
    home:renderHome, peta:renderPeta, scan:renderScan, market:renderMarket,
    profil:renderProfil, edu:renderEdu, tentang:renderTentang
  };

  function go(view, scrollId){
    closeModal();
    if (view !== 'auth' && !state.user) view = 'auth';
    state.view = view;
    $$('.view').forEach(v => v.classList.toggle('hidden', v.id !== 'view-' + view));
    document.body.classList.toggle('is-auth', view === 'auth');
    if (renderers[view]) renderers[view]();
    $$('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.go === view));
    renderTop();
    if (scrollId){
      const el = document.getElementById(scrollId);
      if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    } else {
      window.scrollTo(0, 0);
    }
  }
  function renderTop(){ $('#topBal').textContent = '🪙 ' + fmt(state.balance); }

  /* ---------- AUTH ---------- */
  function setAuthTab(tab){
    $('#form-login').classList.toggle('hidden', tab !== 'login');
    $('#form-register').classList.toggle('hidden', tab !== 'register');
    $$('[data-action="auth-tab"]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  }
  function login(u){
    state.user = u;
    checkBadges();
    go('home');
    toast(`Selamat datang, ${u.name}!`);
  }
  function logout(){
    state.user = null;
    go('auth');
    toast('Kamu sudah keluar. Sampai jumpa lagi!');
  }

  /* ---------- HOME ---------- */
  function renderHome(){
    const u = state.user;
    const lvl = levelOf(state.totalXP);
    const kel = kelById(u.kel);
    const mission = state.activeMission ? MISSIONS.find(m => m.id === state.activeMission) : null;
    const doneDaily = DAILY.filter(d => state.daily[d.id]).length;

    $('#view-home').innerHTML = `
      <div class="hero">
        <div class="hero-top">
          <div>
            <span class="hint">Halo,</span>
            <h2>${esc(u.name)}</h2>
            <span class="hint">${esc(kel.name)} · ${esc(u.group)}</span>
          </div>
          <div class="lvl">Lv ${lvl}</div>
        </div>
        <div class="balance"><span>Saldo Green Coin</span><strong>${fmt(state.balance)}</strong> 🪙</div>
        <div class="xp"><div class="xp-bar" style="width:${progressPct()}%"></div></div>
        <span class="hint">${levelTitle(lvl)} · ${fmt(state.totalXP % LEVEL_XP)}/${fmt(LEVEL_XP)} XP menuju level berikutnya</span>
      </div>

  function evaluate(){
    const c = CATS[state.selectedCat];
    const w = state.weight;
    const [lo,hi] = c.moist;
    const moist = Math.round(lo + Math.random() * (hi - lo));

    if (state.source === 'internet'){
      return { ok:false, title:'Foto Ditolak', xp:0, cat:c,
        reason:'Foto terdeteksi berasal dari internet. Scan harus dilakukan langsung pada sampah milik pengguna.' };
    }
    if (!c.rdf){
      return { ok:false, title:'Bukan Target RDF', moist, xp:10, cat:c, reason:c.note };
    }
    if (moist > 30){
      return { ok:false, title:'Kadar Air Terlalu Tinggi', moist, xp:10, cat:c,
        reason:`Kadar air ${moist}% melebihi batas RDF (maksimal 30%). Sampah basah perlu dipisahkan dan dikeringkan.` };
    }
    const grade = moist <= 15 ? 'A' : 'B';
    const rate  = grade === 'A' ? 12 : 7;
    const coins = Math.round(w * rate);
    const kcal  = Math.round(4800 - moist * 40);
    return { ok:true, grade, rate, coins, xp:20 + coins*2, moist, kcal, cat:c, weight:w };
  }

  function resultHTML(r){
    if (!r.ok){
      return `
        <div class="result bad">

            <button class="btn btn-ghost" data-action="scan-again">Coba lagi</button>
            <button class="btn btn-ghost" data-action="go" data-go="edu">Pelajari RDF</button>
          </div>
        </div>`;
    }
    return `
      <div class="result ok">
        <h3>✅ Sampah Terdeteksi dan Layak RDF</h3>
        <div class="res-grid">
          <div><small>Kadar air</small><b>${r.moist}%</b></div>
          <div><small>Grade RDF</small><b>${r.grade}</b></div>
          <div><small>Estimasi nilai kalor*</small><b>${fmt(r.kcal)} kkal/kg</b></div>

        </div>

      </div>`;
  }

  function analyze(){
    if (state.scanning) return;
    state.scanning = true;
    state.scanResult = null;
    renderScan();
    const steps = [
      'Mendeteksi objek (YOLOv8)…',
      'Mengestimasi kadar air…',
      'Memverifikasi keaslian foto…',
      'Mengklasifikasi kualitas RDF…',
      'Menghitung nilai kalor dan Green Coin…'
    ];
    let i = 0;
    const tick = () => {
      const s = $('#scan-status');
      if (s) s.textContent = steps[i];
      i++;
      setTimeout(i < steps.length ? tick : finishScan, 650);
    };
    tick();
  }

  function finishScan(){
    state.scanning = false;
    const r = evaluate();
    state.scans++;

    if (r.ok){
      state.validScans++;
      state.kg += r.weight;
      addCoins(r.coins, `Scan ${r.cat.label} (${r.weight} kg)`);
      addXP(r.xp);
      const m = state.activeMission ? MISSIONS.find(x => x.id === state.activeMission) : null;
      if (m && m.target === state.selectedCat && r.weight >= m.minKg){
        state.missionsDone++;
        state.activeMission = null;
        r.mission = m;
        addXP(m.xp);
        toast('🎯 Misi selesai: ' + m.title);
      }
      toast(`+${r.coins} Green Coin diterima`);
    } else if (r.xp){
      addXP(r.xp);
    }
    state.scanResult = r;
    checkBadges();
    renderScan();
    renderTop();
  }

      </div>
      <div class="card">
        <h3>Cara kerja</h3>
        <div class="flow">
          <div><em>1</em>Login dan modul edukasi</div>
          <div><em>2</em>Pilih misi di peta</div>
          <div><em>3</em>Pilah dan scan sampah</div>
          <div><em>4</em>AI memvalidasi kualitas</div>
          <div><em>5</em>Hitung nilai RDF dan koin</div>
          <div><em>6</em>Tukar di market atau sosial</div>
        </div>
      </div>
      <div class="card">
        <h3>Model pentahelix</h3>
        <div class="penta">
          ${PENTA.map((p,i) => `
            <button class="${state.openPenta===i?'open':''}" data-action="penta" data-idx="${i}">
              <b>${p.t}</b><small>${p.r}</small>
              ${state.openPenta===i ? `<p>${p.d}</p>` : ''}
            </button>`).join('')}
        </div>
      </div>
      <div class="card">
        <h3>Roadmap tiga tahun</h3>
        <div class="road-tabs">
          ${ROADMAP.map((r,i) => `<button class="${state.roadYear===i?'on':''}" data-action="roadmap" data-idx="${i}">${r.y}</button>`).join('')}
        </div>
        <div class="road-body">
          <b>${ROADMAP[state.roadYear].t}</b>
          <ul>${ROADMAP[state.roadYear].items.map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="card">
        <h3>Triple Bottom Line</h3>
        <span class="hint">Ketuk untuk melihat angka dari aktivitasmu di prototipe ini.</span>
        <div class="tbl-grid">
          <button data-action="tbl" data-k="people"><i>🧑‍🤝‍🧑</i><b>People</b></button>
          <button data-action="tbl" data-k="planet"><i>🌍</i><b>Planet</b></button>
          <button data-action="tbl" data-k="profit"><i>💰</i><b>Profit</b></button>
        </div>
      </div>
      <div class="card">
        <h3>Tim pengembang</h3>
        <p class="team">Arifatu Dzikra (M0401241003)<br/>Syarifah Nabila Jusman (M0401241038)<br/>IPB University</p>
      </div>
      <p class="footer-note">Lomba Essay YES-C 2026 · HMD Ilmu Ekonomi FEB UNP</p>`;
  }
  function showTBL(k){
    const data = {
      people:{ t:'People', rows:[
        ['Scan dilakukan', state.scans],
        ['Modul edukasi selesai', state.lessonsDone.length + '/' + LESSONS.length],
        ['Lencana terbuka', state.unlocked.size + '/' + BADGES.length]] },
      planet:{ t:'Planet', rows:[
        ['Sampah dialihkan dari TPA', state.kg.toFixed(1) + ' kg'],
        ['CO₂ terhindar (simulasi)', co2().toFixed(1) + ' kg']] },
      profit:{ t:'Profit', rows:[
        ['Green Coin diterbitkan', fmt(state.coinsIssued)],
        ['Transaksi tukar poin', state.redeems]] }
    }[k];
    openModal(`
      <span class="tag">Triple Bottom Line</span>
      <h3>${data.t}</h3>
      ${data.rows.map(([a,b]) => `<div class="kv"><span>${a}</span><b>${b}</b></div>`).join('')}
      <span class="hint">Angka berasal dari aktivitas di prototipe ini.</span>
      <button class="btn btn-ghost" data-action="close">Tutup</button>`);
  }

  /* ---------- EVENTS ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const d = el.dataset;
    switch (d.action){
      case 'go':            go(d.go, d.scroll); break;
      case 'auth-tab':      setAuthTab(d.tab); break;
      case 'demo':          login({name:'Adaptor Demo', group:'Mahasiswa', kel:'mekarsari'}); break;
      case 'logout':        logout(); break;
      case 'mood':          setMood(d.mood); break;
      case 'daily':         toggleDaily(d.id); break;
      case 'accept-mission':acceptMission(d.id); break;
      case 'cancel-mission':state.activeMission = null; toast('Misi dibatalkan'); renderHome(); break;
      case 'open-kel':      openKel(d.id); break;
      case 'set-kel':       setKel(d.id); break;
      case 'cat':           state.selectedCat = d.cat; state.scanResult = null; renderScan(); break;
      case 'source':        state.source = d.src; renderScan(); break;
      case 'analyze':       analyze(); break;
      case 'scan-again':    state.scanResult = null; renderScan(); break;
      case 'filter':        state.filter = d.filter; renderMarket(); break;
      case 'redeem':        confirmRedeem(d.id); break;
      case 'confirm-redeem':doRedeem(d.id); break;
      case 'history':       openHistory(); break;
      case 'lesson':        openLesson(d.id); break;
      case 'answer':        answerLesson(d.id, Number(d.idx)); break;
      case 'badge':         showBadge(d.id); break;
      case 'invite':        invite(); break;
      case 'penta':         state.openPenta = state.openPenta === Number(d.idx) ? -1 : Number(d.idx); renderTentang(); break;
      case 'roadmap':       state.roadYear = Number(d.idx); renderTentang(); break;
      case 'tbl':           showTBL(d.k); break;
      case 'close':         closeModal(); break;
    }
  });

  document.addEventListener('input', e => {
    if (e.target.id === 'weight'){
      state.weight = Number(e.target.value);
      const v = $('#w-val');
      if (v) v.textContent = state.weight.toFixed(1);
    }
  });

  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

  $('#form-login').addEventListener('submit', e => {
    e.preventDefault();
    const email = e.target.querySelector('input[type="email"]').value.trim();
    login({name: email.split('@')[0] || 'Adaptor', group:'Mahasiswa', kel:'mekarsari'});
  });
  $('#form-register').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#reg-name').value.trim() || 'Adaptor';
    login({name, group:$('#reg-group').value, kel:$('#reg-kel').value});
  });

  /* ---------- INIT ---------- */
  $('#reg-kel').innerHTML = KELURAHAN.map(k => `<option value="${k.id}">${k.name}</option>`).join('');
  renderTop();
})();
</script>
</body>
</html>
